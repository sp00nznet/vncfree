name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach binaries to a release

jobs:
  # A published advisory against anything in the tree is something to find out about
  # from CI rather than from a user. Separate from the build so a new advisory reports
  # itself without also failing the binaries.
  #
  # A prebuilt cargo-audit rather than rustsec/audit-check: the action spends three and
  # a half minutes compiling the tool on every run, and wants permission to write check
  # runs that this workflow otherwise has no reason to hold.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on a vulnerability. Warnings - an unmaintained crate, say - are printed
      # and do not fail: minifb pulls in `instant`, which is unmaintained and is not
      # even in the Windows dependency graph, so failing on that would train us to
      # ignore this job.
      - run: cargo audit

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Without this every run recompiles the whole dependency tree.
      - uses: Swatinem/rust-cache@v2

      # --locked fails if Cargo.lock would change, so CI builds exactly what was
      # committed rather than silently picking up new dependency versions.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

      # Both binaries. Shipping a release with only the viewer in it would be a
      # strange thing to do to a project whose point is that the server is free too.
      - uses: actions/upload-artifact@v4
        with:
          name: vncfree-windows-x64
          path: |
            target/release/vncfree.exe
            target/release/vncfree-server.exe

      # Only on a version tag: publish on the Releases page so people can download
      # without building, or trusting a binary from anywhere else.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/release/vncfree.exe
            target/release/vncfree-server.exe
          generate_release_notes: true

  # The Android app, built from the same checkout as the Windows binaries so the APK
  # always carries the engine that was just tested above.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: sdkmanager "ndk;26.1.10909125"

      - uses: gradle/actions/setup-gradle@v4

      # No signingConfig in the release build type, so this lands as -unsigned and is
      # signed below.
      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Android refuses to install an unsigned APK. With the release keystore in
      # secrets, builds upgrade over each other; without it, they don't - hence the
      # warning rather than a silent throwaway key.
      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          unsigned=$(find android/app/build/outputs/apk/release -name '*-release-unsigned.apk' | head -1)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ks="$RUNNER_TEMP/vncfree.keystore"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASS"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret - signing with a throwaway key. Users will have to uninstall any previous vncfree before installing this build."
            pass=vncfree123
            keytool -genkeypair -keystore "$ks" -alias vncfree -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$pass" -keypass "$pass" -dname 'CN=vncfree, O=vncfree, C=US'
          fi
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-pass "pass:$pass" --key-pass "pass:$pass" \
            --out "vncfree-$version.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "vncfree-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: vncfree-android
          path: vncfree-*.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: vncfree-*.apk
