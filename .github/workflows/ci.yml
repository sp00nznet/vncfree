name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach binaries to a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Without this every run recompiles the whole dependency tree.
      - uses: Swatinem/rust-cache@v2

      # --locked fails if Cargo.lock would change, so CI builds exactly what was
      # committed rather than silently picking up new dependency versions.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: vncfree-windows-x64
          path: target/release/vncfree.exe

      # Only on a version tag: publish the exe on the Releases page so people can
      # download it without building or trusting a binary from anywhere else.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: target/release/vncfree.exe
          generate_release_notes: true
