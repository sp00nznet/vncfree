[package]
name = "vncfree"
version = "0.0.1"
edition = "2021"

[dependencies]
aes = "0.8"
arboard = { version = "3.6.1", default-features = false }
# Only dep. VNC auth is DES-ECB with a bit-reversed key; hand-rolling DES is not lazy.
des = "0.8"
flate2 = "1.1.9"
getrandom = "0.4.3"
md-5 = "0.10"
minifb = "0.28.0"
num-bigint = "0.5.1"

[profile.release]
opt-level = 3
strip = true
