[package]
name = "vncfree"
version = "0.1.0"
edition = "2021"
description = "A free VNC client and server for Windows. No subscription, no telemetry, no installer."
repository = "https://github.com/sp00nznet/vncfree"
license = "MIT"
readme = "README.md"
keywords = ["vnc", "rfb", "remote-desktop", "windows"]
categories = ["network-programming", "command-line-utilities"]

# Shared RFB protocol pieces. The two binaries below are the client and the server.
[lib]
name = "vncfree"
path = "src/lib.rs"

[[bin]]
name = "vncfree"
path = "src/bin/client.rs"

[[bin]]
name = "vncfree-server"
path = "src/bin/server.rs"

[dependencies]
# Crypto the auth schemes need. Ciphers and 1024-bit modular exponentiation are the
# one place where hand-rolling is reckless rather than lazy.
aes = "0.8"
des = "0.8"
md-5 = "0.10"
num-bigint = "0.5.1"
getrandom = "0.4.3"
# ZRLE is deflate over run-length-encoded tiles.
flate2 = "1.1.9"
# Client only: window, and clipboard without the image-format baggage.
minifb = "0.28.0"
arboard = { version = "3.6.1", default-features = false }

# Screen capture, input injection and the dialogs. windows-sys is the plain binding
# crate and is all the flat C API needs.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
]

# Desktop Duplication is COM, and windows-sys has no COM support - it would be several
# hundred lines of hand-written vtable calls in unsafe code. The full crate brings
# reference counting and QueryInterface, which is worth a dependency when the
# alternative is managing COM lifetimes by hand.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # DXGI_OUTPUT_DESC carries an HMONITOR, so GetDesc needs this too.
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = 3
strip = true
